name: Update behaviour labels

on:
  push:
    paths:
      - '.github/workflows/update-behaviour-labels.yml'

permissions:
  contents: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update visible behaviour labels
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('ready-for-supervisor-senior-chef.html'),
              Path('assistant-manager-second-chef.html'),
              Path('general-manager-head-chef.html'),
          ]

          replacements = {
              'title: "Thriving Under Pressure"': 'title: "Thriving under pressure"',
              'title: "Taking Ownership"': 'title: "Taking ownership"',
              'title: "Good Communicator"': 'title: "Good communicator"',
              'title: "Supportive & Empathetic"': 'title: "Cares for people"',
              'title: "Pizza, Pride & Passion"': 'title: "Pride & Passion"',
              'title: "Drive!"': 'title: "Curiousity and drive"',
              'title: "Find Your Drive"': 'title: "Curiousity and drive"',
              'title: "Find your drive"': 'title: "Curiousity and drive"',
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise RuntimeError(f'No behaviour labels changed in {path}')
              path.write_text(text, encoding='utf-8')

      - name: Commit label changes
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ready-for-supervisor-senior-chef.html assistant-manager-second-chef.html general-manager-head-chef.html
          git commit -m "Standardise development tracker behaviour labels"
          git push origin main

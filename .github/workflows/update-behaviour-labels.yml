name: Update behaviour labels

on:
  push:
    paths:
      - '.github/workflows/update-behaviour-labels.yml'

permissions:
  contents: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct Curiosity spelling
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('ready-for-supervisor-senior-chef.html'),
              Path('assistant-manager-second-chef.html'),
              Path('general-manager-head-chef.html'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('title: "Curiousity and drive"', 'title: "Curiosity and drive"')
              if updated == text:
                  raise RuntimeError(f'Curiousity label not found in {path}')
              path.write_text(updated, encoding='utf-8')

      - name: Commit spelling correction
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ready-for-supervisor-senior-chef.html assistant-manager-second-chef.html general-manager-head-chef.html
          git commit -m "Correct Curiosity spelling"
          git push origin main
